[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-scientist-harness"
version = "0.1.0"
description = "A persistent, policy-bounded AI scientist harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pydantic>=2.0,<3",
  "icalendar>=7.3,<8",
  "python-dateutil>=2.9,<3",
  "caldav>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
ai-scientist = "ai_scientist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
